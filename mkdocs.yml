theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search
  - meta

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SRrobot-ShiRui/Learning-Robotics-for-beginners
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/1985904092/lists/1497284
    - icon: fontawesome/solid/rss
      link: https://blog.csdn.net/2301_81238088

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
